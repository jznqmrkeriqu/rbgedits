<!-- Custom Scripts -->
    <script>
        AOS.init({ duration: 1000 });

        /* Preloader & Loading bar */
        let percent = 0;
        const timer = setInterval(() => {
            percent++;
            const fill = document.getElementById("loadingFill");
            const text = document.getElementById("loadingText");
            if (fill) fill.style.width = percent + "%";
            if (text) text.innerHTML = percent + "%";
            
            if (percent >= 100) {
                clearInterval(timer);
                const loader = document.getElementById("loader");
                if (loader) {
                    loader.style.opacity = "0";
                    setTimeout(() => {
                        loader.style.display = "none";
                    }, 500);
                }
            }
        }, 20);

        /* Typing Effect */
        const text = "Professional Video Editing | Gaming Montages | CapCut | Alight Motion | Motion Graphics";
        let i = 0;
        function typing() {
            const typingElem = document.getElementById("typing");
            if (typingElem && i < text.length) {
                typingElem.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, 45);
            }
        }
        window.addEventListener('load', typing);

        /* Visitor Counter */
        let visits = localStorage.getItem("rbgVisits") || 0;
        visits = parseInt(visits) + 1;
        localStorage.setItem("rbgVisits", visits);
        const visitElem = document.getElementById("visitCount");
        if (visitElem) visitElem.innerHTML = visits;

        /* Scroll Progress Bar & Back to Top */
        window.onscroll = function() {
            let winScroll = document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            
            const pBar = document.getElementById("progressBar");
            if (pBar) pBar.style.width = scrolled + "%";

            const btn = document.getElementById("topBtn");
            if (btn) {
                if (winScroll > 300) {
                    btn.style.display = "block";
                } else {
                    btn.style.display = "none";
                }
            }
        };

        function topFunction() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        /* Custom Cursor Follower */
        const cursor = document.getElementById("cursor");
        const cursorGlow = document.getElementById("cursorGlow");
        document.addEventListener("mousemove", (e) => {
            if (cursor && cursorGlow) {
                cursor.style.left = e.clientX + "px";
                cursor.style.top = e.clientY + "px";
                cursorGlow.style.left = e.clientX + "px";
                cursorGlow.style.top = e.clientY + "px";
            }
        });

        /* Particles Effect Canvas */
        const canvas = document.getElementById("particles");
        if (canvas) {
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let dots = [];

            for(let i = 0; i < 80; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 3 + 1,
                    dx: (Math.random() - 0.5),
                    dy: (Math.random() - 0.5)
                });
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff2020";
                dots.forEach(d => {
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                    ctx.fill();
                    d.x += d.dx;
                    d.y += d.dy;

                    if (d.x < 0 || d.x > canvas.width) d.dx *= -1;
                    if (d.y < 0 || d.y > canvas.height) d.dy *= -1;
                });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        /* Video Popup Controls */
        function openVideo(src) {
            const popup = document.getElementById('videoPopup');
            const video = document.getElementById('popupVideo');
            if (popup && video) {
                video.src = src;
                popup.style.display = 'flex';
                video.play();
            }
        }
        function closeVideo() {
            const popup = document.getElementById('videoPopup');
            const video = document.getElementById('popupVideo');
            if (popup && video) {
                video.pause();
                popup.style.display = 'none';
            }
        }

        /* Music Toggle */
        function toggleMusic() {
            const music = document.getElementById("bgMusic");
            if (music) {
                if (music.paused) {
                    music.play();
                } else {
                    music.pause();
                }
            }
        }

        /* AI Chat Box Toggle */
        function toggleChat() {
            const chat = document.getElementById("chatBox");
            if (chat) {
                chat.style.display = chat.style.display === "block" ? "none" : "block";
            }
        }

        function sendMessage() {
            const input = document.getElementById("userMsg");
            const msgs = document.getElementById("chatMessages");
            if (input && msgs && input.value.trim() !== "") {
                msgs.innerHTML += `<div style="margin-top:8px; text-align:right; color:#ff2020;"><b>You:</b> ${input.value}</div>`;
                const userQuery = input.value;
                input.value = "";
                setTimeout(() => {
                    msgs.innerHTML += `<div style="margin-top:8px; text-align:left; color:#fff;"><b>RBG AI:</b> Thank you for contacting! Reach out on WhatsApp for quick reply.</div>`;
                    msgs.scrollTop = msgs.scrollHeight;
                }, 600);
            }
        }
    </script>
</body>
</html>
